<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-label="Path of one beitlabduino mailbox command from the Ubuntu PC to the C906 and back">
<rect width="1120" height="800" fill="#ffffff"/>
<text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" fill="#1f2328" font-weight="bold" font-style="normal">One command, ./bl_send.sh 0x41 1 (LED on), from the Ubuntu PC to the C906 and back</text>
<rect x="10" y="48" width="205" height="620" rx="10" fill="#f3f4f6"/>
<text x="112.5" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">Ubuntu PC</text>
<rect x="225" y="48" width="430" height="620" rx="10" fill="#eaf2ff"/>
<text x="440.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">Duo S · Linux on the Cortex-A53</text>
<rect x="695" y="48" width="415" height="620" rx="10" fill="#fff3e6"/>
<text x="902.5" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">Duo S · C906 little core, FreeRTOS</text>
<rect x="657" y="48" width="36" height="620" rx="6" fill="#ece6f8"/>
<text transform="translate(684 390) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b3fa0" font-weight="bold">mailbox (hardware)</text>
<line x1="112" y1="124" x2="112" y2="656" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="20" y="80" width="184" height="44" rx="7" fill="#ffffff" stroke="#8c959f"/>
<text x="112" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">your terminal</text>
<text x="112" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">./bl_send.sh</text>
<line x1="330" y1="124" x2="330" y2="656" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="238" y="80" width="184" height="44" rx="7" fill="#ffffff" stroke="#8c959f"/>
<text x="330" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">bl_send</text>
<text x="330" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">/usr/bin/bl_send</text>
<line x1="560" y1="124" x2="560" y2="656" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="468" y="80" width="184" height="44" rx="7" fill="#ffffff" stroke="#8c959f"/>
<text x="560" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">kernel driver</text>
<text x="560" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">/dev/cvi-rtos-cmdqu</text>
<line x1="790" y1="124" x2="790" y2="656" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="698" y="80" width="184" height="44" rx="7" fill="#ffffff" stroke="#8c959f"/>
<text x="790" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">playground runtime</text>
<text x="790" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">playground_rt.c</text>
<line x1="1000" y1="124" x2="1000" y2="656" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="908" y="80" width="184" height="44" rx="7" fill="#ffffff" stroke="#8c959f"/>
<text x="1000" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold" font-style="normal">your program</text>
<text x="1000" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">beitlabduino + main.c</text>
<rect x="555" y="205" width="10" height="345" rx="3" fill="#cfd8e3"/>
<text x="546" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#57606a" font-weight="normal" font-style="italic">waits for the reply</text>
<text x="546" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" fill="#57606a" font-weight="normal" font-style="italic">(up to 1000 ms)</text>
<line x1="125" y1="160" x2="317" y2="160" stroke="#1f5fbf" stroke-width="2"/>
<polygon points="326,160 315,155 315,165" fill="#1f5fbf"/>
<circle cx="112" cy="160" r="10" fill="#1f5fbf"/>
<text x="112" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">1</text>
<text x="221.0" y="139" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">ssh -t beitlab@board bl_send 0x41 1</text>
<text x="221.0" y="153" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">over the network (bl_send.sh)</text>
<line x1="343" y1="215" x2="547" y2="215" stroke="#1f5fbf" stroke-width="2"/>
<polygon points="556,215 545,210 545,220" fill="#1f5fbf"/>
<circle cx="330" cy="215" r="10" fill="#1f5fbf"/>
<text x="330" y="219" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">2</text>
<text x="445.0" y="194" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">ioctl(SEND_WAIT)</text>
<text x="445.0" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">cmd 0x41, value 1, wait 1000 ms</text>
<line x1="573" y1="270" x2="777" y2="270" stroke="#1f5fbf" stroke-width="2"/>
<polygon points="786,270 775,265 775,275" fill="#1f5fbf"/>
<circle cx="560" cy="270" r="10" fill="#1f5fbf"/>
<text x="560" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">3</text>
<text x="675.0" y="249" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">message into a slot</text>
<text x="675.0" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">+ interrupt to the C906</text>
<line x1="803" y1="325" x2="987" y2="325" stroke="#1f5fbf" stroke-width="2"/>
<polygon points="996,325 985,320 985,330" fill="#1f5fbf"/>
<circle cx="790" cy="325" r="10" fill="#1f5fbf"/>
<text x="790" y="329" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">4</text>
<text x="895.0" y="304" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">queue for cmd 0x41</text>
<text x="895.0" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">set up by bl_cmd_listen()</text>
<rect x="905" y="348" width="190" height="70" rx="7" fill="#fffbdd" stroke="#d4a72c"/>
<circle cx="905" cy="348" r="10" fill="#1f5fbf"/>
<text x="905" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">5</text>
<text x="1000" y="368" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">bl_cmd_receive() returns 1</text>
<text x="1000" y="386" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">handle(): LED on (A29)</text>
<text x="1000" y="404" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">log: led mode 1</text>
<line x1="987" y1="455" x2="803" y2="455" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="794,455 805,450 805,460" fill="#1a7f37"/>
<circle cx="1000" cy="455" r="10" fill="#1a7f37"/>
<text x="1000" y="459" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">6</text>
<text x="895.0" y="434" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">bl_cmd_reply(cmd, 1)</text>
<text x="895.0" y="448" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">sends 0x80000001 (bit 31 = ack)</text>
<line x1="777" y1="510" x2="573" y2="510" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="564,510 575,505 575,515" fill="#1a7f37"/>
<circle cx="790" cy="510" r="10" fill="#1a7f37"/>
<text x="790" y="514" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">7</text>
<text x="675.0" y="489" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">reply into a slot</text>
<text x="675.0" y="503" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">+ interrupt to Linux</text>
<line x1="547" y1="565" x2="343" y2="565" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="334,565 345,560 345,570" fill="#1a7f37"/>
<circle cx="560" cy="565" r="10" fill="#1a7f37"/>
<text x="560" y="569" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">8</text>
<text x="445.0" y="544" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">ioctl returns</text>
<text x="445.0" y="558" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">with value 0x80000001</text>
<line x1="317" y1="620" x2="125" y2="620" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="116,620 127,615 127,625" fill="#1a7f37"/>
<circle cx="330" cy="620" r="10" fill="#1a7f37"/>
<text x="330" y="624" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold" font-style="normal">9</text>
<text x="221.0" y="599" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#1f2328" font-weight="normal" font-style="normal">prints 1, exit 0</text>
<text x="221.0" y="613" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#57606a" font-weight="normal" font-style="normal">back through SSH</text>
<rect x="20" y="690" width="525" height="92" rx="8" fill="#ffffff" stroke="#8c959f"/>
<text x="36" y="714" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold" font-style="normal">From the Ubuntu PC: steps 1 to 9</text>
<text x="36" y="740" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal" font-style="normal">./bl_send.sh 0x41 1</text>
<text x="36" y="760" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal" font-style="normal">is the same as:  ssh -t beitlab@&lt;board&gt; bl_send 0x41 1</text>
<rect x="575" y="690" width="525" height="92" rx="8" fill="#ffffff" stroke="#8c959f"/>
<text x="591" y="714" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold" font-style="normal">On the Duo S itself: steps 2 to 8</text>
<text x="591" y="740" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal" font-style="normal">ssh -t beitlab@&lt;board&gt;      (log in once)</text>
<text x="591" y="760" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal" font-style="normal">bl_send 0x41 1        (prints 1 in that shell)</text>
</svg>
