[platformio]
extra_configs = ../common/playground.ini
default_envs = robotics_board

; Robotics carrier revision 0.11: onboard BMI323.
[env:robotics_board]
extends = playground
custom_profile = beitlab_robotics_rev011_imu
custom_libs = beitlabduino beitlabduino_imu

; Standalone Milk-V Duo S, carrier disconnected: external BMI160 on J3.
[env:milkv]
extends = playground
custom_profile = duos_bare_bmi160_j3
custom_libs = beitlabduino beitlabduino_imu
