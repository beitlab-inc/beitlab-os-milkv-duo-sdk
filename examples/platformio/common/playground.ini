; Shared settings for every beitlab Robotics MilkV duo OS example.
; Each example's platformio.ini loads this file and selects its hardware:
;
;   [platformio]
;   extra_configs = ../common/playground.ini
;   default_envs = hello
;   [env:hello]
;   extends = playground
;   custom_profile = duos_bare
;
; Shared libraries live in common/lib/<name>/. An example opts in with
; `custom_libs = <name> [...]` in its [env:...]; the builder compiles that
; folder's .c/.S files and adds it to the include path. See
; common/lib/beitlabduino/beitlabduino.h.
;
; Board connection, overridable from the environment:
;   PIO_DUO_HOST  default beitlab-milkv-duo.local
;   PIO_DUO_USER  default beitlab
;   PIO_DUO_PASS  password for non-interactive upload (else keys, or ssh asks)

[playground]
; Not `platform = native` (host build) and not chipsalliance: a local
; platform whose builder calls firmware/rtosbuild.py, which takes its
; -march/-mabi from the pinned SDK toolchain-riscv64-elf.cmake.
platform = symlink://../common/platform-duoc906
board = duos-c906l
; Carrier protection is the default. Select duos_bare explicitly only when
; no carrier is attached. See docs/PROFILES.md for the allowed outputs.
custom_profile = beitlab_robotics_rev011
upload_protocol = custom
upload_command = python3 ../common/upload.py $SOURCE
; PlatformIO reserves `-t monitor` for its serial monitor, so the network
; log is the platform target `pio run -t rtmonitor`, which runs this:
custom_monitor = python3 ../common/monitor.py
