# beitlab Robotics MilkV duo OS: one DHCP client for wired and wireless.
hostname
duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
allowinterfaces end0 eth0 wlan0
# WPA is managed by beitlab-wpa.service, never by a dhcpcd hook.
nohook wpa_supplicant
interface end0
metric 100
interface eth0
metric 100
interface wlan0
metric 200
