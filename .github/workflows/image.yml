name: Build OS image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host test tools
        run: sudo apt-get update && sudo apt-get install -y busybox dosfstools mtools openssl
      - name: Test source and imager
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for script in scripts/*.sh firmware/starter/build.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts/tests -v
      - name: Test agent ELF validation and hashing without SDK
        run: |
          make -C agent B="$RUNNER_TEMP/agent-tests" "$RUNNER_TEMP/agent-tests/test_unit"
          "$RUNNER_TEMP/agent-tests/test_unit"

  image:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.IMAGE_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]]
          tag="v$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo 'Release tag does not match VERSION' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "BEITLAB_WORK_DIR=$RUNNER_TEMP/beitlab-duo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Free unused hosted-runner tools
        if: runner.environment == 'github-hosted'
        run: |
          # Only the disposable GitHub VM is cleaned, never a self-hosted machine.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/lib/jvm /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /opt/az /opt/google
      - name: Check build resources
        run: |
          command -v docker
          docker info >/dev/null
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( available < 45 * 1024 * 1024 )); then
            echo 'SDK build needs at least 45 GiB free. Set IMAGE_BUILD_RUNNER to a larger/self-hosted runner label.' >&2
            df -h "$RUNNER_TEMP"
            exit 1
          fi
      - name: Build pinned SDK image and run image checks
        env:
          PLAYGROUND_README_URL: https://github.com/${{ github.repository }}#readme
        run: |
          mkdir -p "$BEITLAB_WORK_DIR"
          scripts/build-image.sh --docker 2>&1 | tee "$BEITLAB_WORK_DIR/build.log"
      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          /usr/bin/python3 scripts/package-release.py --build-dir "$BEITLAB_WORK_DIR/releases/$VERSION" --asset-dir "$BEITLAB_WORK_DIR/assets"
          (cd "$BEITLAB_WORK_DIR/assets" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: duo-os-release
          path: ${{ env.BEITLAB_WORK_DIR }}/assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: duo-os-build-diagnostics
          path: |
            ${{ env.BEITLAB_WORK_DIR }}/build.log
            ${{ env.BEITLAB_WORK_DIR }}/releases/*/*checks.txt
            ${{ env.BEITLAB_WORK_DIR }}/releases/*/dtb-check.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: duo-os-release
          path: ${{ runner.temp }}/release-assets
      - name: Verify and attach assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.image.outputs.tag }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          cd "$ASSET_DIR"
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" == true ]]
            [[ "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json targetCommitish --jq .targetCommitish)" == "$BUILD_COMMIT" ]]
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --draft --target "$BUILD_COMMIT" --title "beitlab Robotics MilkV duo OS $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber ./*
